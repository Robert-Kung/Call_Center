services:
  callcenter-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: callcenter-app
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./.env:/app/.env
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3100
      # Token Server: 同 compose 網路，直接用 service name（vite.config.js 預期的接法）
      - TOKEN_SERVER_HOST=callcenter-token
      - TOKEN_SERVER_PORT=3005
    command: ["npm", "run", "dev"]
    restart: unless-stopped
    depends_on:
      - callcenter-token

  callcenter-token:
    image: node:22.23.5-alpine
    container_name: callcenter-token
    working_dir: /app
    ports:
      - "127.0.0.1:3005:3005"
    volumes:
      - ./token-server:/app
    env_file:
      - ./token-server/.env
    command: sh -c "npm install && npm start"
    restart: unless-stopped
